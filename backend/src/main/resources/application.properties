spring.application.name=clinicify-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/clinicify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console when using MySQL
spring.h2.console.enabled=false

# JWT Configuration
clinicify.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
clinicify.jwt.expiration-ms=86400000

# Prediction baseline (default average consultation duration in minutes)
clinicify.queue.average-consultation-minutes=12
